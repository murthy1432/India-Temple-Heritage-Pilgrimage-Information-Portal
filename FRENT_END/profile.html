<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage your profile and saved places of worship.">
    <title>My Profile | India Sacred Sites Portal</title>
    <link rel="stylesheet" href="portal-nav.css">
    <script src="portal-nav.js" defer></script>
    <link rel="stylesheet" href="profile.css">
    <script src="profile.js" defer></script>
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <header class="site-header" data-site-header></header>
    <main class="container">
        <section class="profile-summary" aria-labelledby="profile-page-title" hidden>
            <div class="summary-avatar-wrap">
                <img class="summary-avatar" id="summary-photo" alt="" hidden>
                <span class="summary-initial" id="summary-initial" aria-hidden="true">U</span>
            </div>
            <div class="summary-copy">
                <h1 id="profile-page-title">My Profile</h1>
                <p class="summary-detail" id="summary-phone"></p>
                <p class="summary-detail" id="summary-email"></p>
            </div>
            <button class="edit-profile-button" id="edit-profile" type="button" aria-label="Edit profile details" title="Edit profile details">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M12 20h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    <path d="m16.5 3.5 4 4L8 20l-5 1 1-5L16.5 3.5Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </section>
        <p class="status" id="page-status" role="status" aria-live="polite">Loading your profile...</p>

        <div class="profile-grid" id="profile-content" hidden>
            <aside class="profile-sidebar" aria-label="Profile sections">
                <div class="profile-tabs" role="tablist" aria-label="Profile sections">
                    <button class="profile-tab" id="settings-tab" type="button" role="tab" aria-selected="true" aria-controls="settings-panel" tabindex="0">
                        <svg class="profile-tab-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
                            <path d="m19.4 15 .1.1a1.7 1.7 0 0 1-2.4 2.4L17 17.4a7.8 7.8 0 0 1-2 .8v.2a1.7 1.7 0 0 1-3.4 0v-.2a7.8 7.8 0 0 1-2-.8l-.1.1a1.7 1.7 0 0 1-2.4-2.4l.1-.1a7.8 7.8 0 0 1-.8-2h-.2a1.7 1.7 0 0 1 0-3.4h.2a7.8 7.8 0 0 1 .8-2l-.1-.1a1.7 1.7 0 0 1 2.4-2.4l.1.1a7.8 7.8 0 0 1 2-.8v-.2a1.7 1.7 0 0 1 3.4 0v.2a7.8 7.8 0 0 1 2 .8l.1-.1a1.7 1.7 0 0 1 2.4 2.4l-.1.1a7.8 7.8 0 0 1 .8 2h.2a1.7 1.7 0 0 1 0 3.4h-.2a7.8 7.8 0 0 1-.8 2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                        </svg>
                        Account settings
                    </button>
                    <button class="profile-tab" id="saved-tab" type="button" role="tab" aria-selected="false" aria-controls="saved-panel" tabindex="-1">
                        <svg class="profile-tab-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M6 4.8A1.8 1.8 0 0 1 7.8 3h8.4A1.8 1.8 0 0 1 18 4.8V21l-6-3.8L6 21V4.8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                        </svg>
                        Saved places
                    </button>
                </div>
                <hr class="sidebar-divider">
                <button class="logout-button" id="profile-logout" type="button">Log out</button>
                <p class="logout-status" id="logout-status" role="status" aria-live="polite"></p>
            </aside>

            <div class="profile-panels">
                <section class="panel" id="settings-panel" role="tabpanel" aria-labelledby="settings-tab">
                    <h2 id="profile-heading">Account settings</h2>
                    <p class="panel-intro" id="account-username"></p>
                    <div class="settings-options" id="settings-options">
                        <button class="settings-option" id="open-profile-editor" type="button">
                            <div>
                                <strong>Profile details</strong>
                                <span>Change your photo, name, phone number, or email.</span>
                            </div>
                            <span aria-hidden="true">›</span>
                        </button>
                        <button class="settings-option" id="open-password-settings" type="button">
                            <div>
                                <strong>Password &amp; security</strong>
                                <span>Update your password and keep your account secure.</span>
                            </div>
                            <span aria-hidden="true">›</span>
                        </button>
                    </div>

                    <section id="profile-edit-panel" aria-labelledby="profile-edit-heading" hidden>
                        <button class="settings-back" id="profile-edit-back" type="button">← Back to account settings</button>
                        <h3 id="profile-edit-heading">Edit profile details</h3>
                        <form id="profile-form">
                            <div class="photo-row">
                                <img class="profile-photo" id="profile-photo" alt="Profile photo" hidden>
                                <div class="photo-actions">
                                    <span class="field-label">Profile photo</span>
                                    <input id="gallery-photo-input" type="file" accept="image/*" hidden>
                                    <input id="camera-photo-input" type="file" accept="image/*" capture="user" hidden>
                                    <div class="photo-picker-actions">
                                        <button class="photo-picker-button" id="take-photo" type="button">Take a photo</button>
                                        <button class="photo-picker-button" id="choose-photo" type="button">Choose from gallery</button>
                                    </div>
                                    <button class="remove-photo" id="remove-photo" type="button" hidden>Remove current photo</button>
                                </div>
                            </div>
                            <div class="field">
                                <label for="display-name">Name</label>
                                <input id="display-name" name="displayName" type="text" maxlength="80" autocomplete="name">
                            </div>
                            <div class="field">
                                <label for="phone-number">Phone number</label>
                                <input id="phone-number" name="phone" type="tel" maxlength="25" autocomplete="tel" placeholder="+91 98765 43210">
                            </div>
                            <div class="field">
                                <label for="email-address">Email</label>
                                <input id="email-address" name="email" type="email" maxlength="254" autocomplete="email">
                            </div>
                            <button class="save-button" id="save-profile" type="submit">Save details</button>
                            <p class="status" id="profile-status" role="status" aria-live="polite"></p>
                        </form>
                    </section>

                    <section class="settings-section" id="password-settings-panel" aria-labelledby="password-heading" hidden>
                        <button class="settings-back" id="password-settings-back" type="button">← Back to account settings</button>
                        <h3 id="password-heading">Password &amp; security</h3>
                        <p class="settings-section-intro">Change your password to help keep your account secure.</p>
                        <form id="password-form">
                            <div class="field">
                                <label for="current-password">Current password</label>
                                <input id="current-password" name="currentPassword" type="password" autocomplete="current-password" maxlength="128" required>
                            </div>
                            <div class="field">
                                <label for="new-password">New password</label>
                                <input id="new-password" name="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
                            </div>
                            <div class="field">
                                <label for="confirm-new-password">Confirm new password</label>
                                <input id="confirm-new-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
                            </div>
                            <button class="save-button" id="save-password" type="submit">Update password</button>
                            <p class="status" id="password-status" role="status" aria-live="polite"></p>
                        </form>
                    </section>
                </section>

                <section class="panel" id="saved-panel" role="tabpanel" aria-labelledby="saved-tab" hidden>
                    <h2 id="saved-heading">Your saved places</h2>
                    <p class="panel-intro">The places of worship you have saved to visit later.</p>
                    <div class="saved-list" id="saved-list"></div>
                    <a class="browse-link" href="sacred-sites.html">Explore more places of worship</a>
                </section>
            </div>
        </div>
    </main>
